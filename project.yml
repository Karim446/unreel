name: Unreel
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
targets:
  Unreel:
    type: application
    platform: iOS
    sources:
      - path: Unreel
        excludes: ["Resources/**"]
      - path: Unreel/Resources
        buildPhase: resources
    info:
      path: Unreel/Info.plist
      properties:
        # Let the app draw at 120 Hz on ProMotion iPhones (apps are capped at 60 Hz without this).
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Take a photo to send in a chat.
        NSMicrophoneUsageDescription: Record voice messages in chats.
        CFBundleURLTypes:
          - CFBundleURLName: unreel
            CFBundleURLSchemes: [unreel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.unreel
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Instagram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Unreel AppIcon-Midnight AppIcon-Ocean AppIcon-Mono"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
