name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test tools
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: tests
        run: npm test
