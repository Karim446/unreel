name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Unreel.xcodeproj -target Unreel \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40 || true

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Unreel.app Payload/
          zip -qr Unreel.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Unreel-ipa
          path: Unreel.ipa
